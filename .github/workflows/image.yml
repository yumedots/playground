name: image

on:
  workflow_dispatch:
  push:
    paths:
      - "guest/**"
      - "shared/**"
      - "xmake.lua"
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            .cache/archlinuxarm.tar.gz
            .cache/archlinuxarm.md5
            .cache/mirror.url
          key: archlinuxarm-tarball
      - name: tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends e2fsprogs qemu-utils qt6-base-dev pigz
      - name: build the plain image
        run: xmake image
      - name: stage the release assets
        run: |
          mkdir -p .cache/image
          qemu-img convert -c -O qcow2 .cache/base.qcow2 .cache/image/base.qcow2
          cp .cache/boot/Image .cache/boot/initramfs-linux.img .cache/image/
          cd .cache/image
          sha256sum base.qcow2 Image initramfs-linux.img > image.sha256
          ls -lh
      - name: publish
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: .cache/image/
          compression-level: 0
          retention-days: 90
